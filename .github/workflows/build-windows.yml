# Windows에서 시험 → PyInstaller로 실행파일 빌드 → Inno Setup으로 설치 파일(KnuZoom-Setup-<버전>.exe) 생성
# 결과물은 Actions 실행 화면의 Artifacts에서 내려받는다.
name: Windows 설치 파일 빌드

on:
  push:
    branches: [main, "claude/**"]  # 작업 브랜치에서도 Windows 시험·빌드를 미리 확인
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[windows,dev]"

      - name: 시험
        run: pytest -q

      - name: FFmpeg(LGPL 빌드) 내려받기
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $root = Get-ChildItem ffmpeg_dl -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force third_party\ffmpeg | Out-Null
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe", "$($root.FullName)\bin\ffprobe.exe" third_party\ffmpeg\
          Copy-Item "$($root.FullName)\LICENSE.txt" third_party\ffmpeg\LICENSE.txt
          third_party\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          $enc = third_party\ffmpeg\ffmpeg.exe -hide_banner -encoders | Select-String "h264_mf"
          if (-not $enc) { Write-Error "이 FFmpeg 빌드에 h264_mf 인코더가 없음"; exit 1 }
          Write-Host $enc

      - name: 녹화 시험(시험 영상 + 사인파 5초 → mp4)
        run: python scripts/record_smoke.py third_party\ffmpeg\ffmpeg.exe

      - name: 화면 캡처(ddagrab) 시험 — 결과만 기록
        continue-on-error: true
        shell: pwsh
        run: |
          third_party\ffmpeg\ffmpeg.exe -hide_banner -y -f lavfi -i "ddagrab=output_idx=0:framerate=10:draw_mouse=0" -t 3 -vf "hwdownload,format=bgra,format=nv12" -c:v h264_mf ddagrab_test.mp4
          third_party\ffmpeg\ffprobe.exe -v error -show_entries format=duration -of default=nw=1:nk=1 ddagrab_test.mp4

      - name: 버전 읽기
        id: version
        shell: python
        run: |
          import os, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"version={v}\n")

      - name: 실행파일 빌드(PyInstaller)
        run: pyinstaller --noconfirm knuzoom.spec

      - name: 실행 시험(빌드된 KnuZoom.exe가 켜지는지)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\KnuZoom\KnuZoom.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "KnuZoom.exe가 시작 직후 종료됨(종료 코드 $($p.ExitCode))"; exit 1 }
          $p.Refresh()
          $title = $p.MainWindowTitle
          Write-Host "KnuZoom.exe 실행 유지 확인(PID $($p.Id), 창 제목 '$title')"
          Stop-Process -Id $p.Id -Force
          $log = Join-Path $env:APPDATA "KnuZoom\logs"
          if (Test-Path $log) { Get-ChildItem $log | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName } }
          # 오류 창이 떠 있어도 프로세스는 살아 있으므로, 시작 기록이 남았는지로 정상 시작을 확인한다
          if ($title -like "*Unhandled exception*") { Write-Error "KnuZoom.exe 시작 중 오류 창이 떴음"; exit 1 }
          $started = (Test-Path $log) -and (Get-ChildItem $log | Select-String -SimpleMatch "KnuZoom 시작" -Quiet)
          if (-not $started) { Write-Error "KnuZoom.exe가 정상 시작 기록을 남기지 않음"; exit 1 }

      - name: Inno Setup 설치
        run: choco install innosetup -y --no-progress

      - name: 설치 파일 빌드(Inno Setup)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\knuzoom.iss'

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: KnuZoom-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/KnuZoom-Setup-*.exe
          if-no-files-found: error
