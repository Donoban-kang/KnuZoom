# Windows에서 시험 → PyInstaller로 실행파일 빌드 → Inno Setup으로 설치 파일(KnuZoom-Setup-<버전>.exe) 생성
# 결과물은 Actions 실행 화면의 Artifacts에서 내려받는다.
name: Windows 설치 파일 빌드

on:
  push:
    branches: [main, "claude/**"]  # 작업 브랜치에서도 Windows 시험·빌드를 미리 확인
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[windows,dev]"

      - name: 시험
        run: pytest -q

      - name: 버전 읽기
        id: version
        shell: python
        run: |
          import os, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"version={v}\n")

      - name: 실행파일 빌드(PyInstaller)
        run: pyinstaller --noconfirm knuzoom.spec

      - name: 실행 시험(빌드된 KnuZoom.exe가 켜지는지)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\KnuZoom\KnuZoom.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "KnuZoom.exe가 시작 직후 종료됨(종료 코드 $($p.ExitCode))"; exit 1 }
          Write-Host "KnuZoom.exe 실행 유지 확인(PID $($p.Id))"
          Stop-Process -Id $p.Id -Force
          $log = Join-Path $env:APPDATA "KnuZoom\logs"
          if (Test-Path $log) { Get-ChildItem $log | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName } }

      - name: Inno Setup 설치
        run: choco install innosetup -y --no-progress

      - name: 설치 파일 빌드(Inno Setup)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\knuzoom.iss'

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: KnuZoom-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/KnuZoom-Setup-*.exe
          if-no-files-found: error
